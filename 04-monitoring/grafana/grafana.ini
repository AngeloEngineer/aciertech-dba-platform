################################################################################
# GRAFANA CONFIGURATION — AcierTech Industries S.A. — INF1620
# Fichier : 04-monitoring/grafana/grafana.ini
#
# Points critiques pour intégration 05-webapp/ :
#   - allow_embedding = true      → iframes dans la webapp d'administration HA
#   - auth.anonymous enabled      → viewers sans authentification (lecture seule)
#   - org_name = AcierTech        → organisation Grafana dédiée
#
# Déploiement : monitoring-server, port 3000 (interne)
# URL publique webapp : http://monitoring-server:3000 (ou proxy inverse)
################################################################################

[paths]
data     = /var/lib/grafana
logs     = /var/log/grafana
plugins  = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

################################################################################
[server]
################################################################################
protocol          = http
http_addr         = 0.0.0.0
http_port         = 3000
domain            = monitoring-server
root_url          = http://monitoring-server:3000/

# Permet l'intégration dans la 05-webapp/ via iframes
enforce_domain    = false

serve_from_sub_path = false

################################################################################
[database]
################################################################################
# Base SQLite par défaut — suffisant pour usage interne AcierTech
# Migrer vers PostgreSQL si Grafana est hautement disponible
type = sqlite3
path = grafana.db

################################################################################
[security]
################################################################################
admin_user     = admin
# Changer le mot de passe via GF_SECURITY_ADMIN_PASSWORD (variable d'environnement)
# ou grafana-cli admin reset-admin-password
admin_password = CHANGE_ME_IN_ENV

# CRITIQUE pour 05-webapp/ : autoriser l'embedding dans des iframes
allow_embedding = true

# Désactiver HSTS si le reverse proxy gère le TLS
cookie_secure   = false
cookie_samesite = lax

# Content Security Policy — ajuster si la webapp a un domaine différent
content_security_policy = false

################################################################################
[users]
################################################################################
allow_sign_up         = false   # Pas d'auto-inscription
allow_org_create      = false
auto_assign_org       = true
auto_assign_org_id    = 1
auto_assign_org_role  = Viewer  # Les nouveaux utilisateurs sont viewers par défaut

################################################################################
[auth]
################################################################################
disable_login_form    = false
disable_signout_menu  = false

################################################################################
[auth.anonymous]
################################################################################
# Accès en lecture seule sans authentification pour les dashboards publics
# Utilisé par la 05-webapp/ pour afficher les dashboards en embedded
enabled      = true
org_name     = AcierTech
org_role     = Viewer

################################################################################
[auth.basic]
################################################################################
enabled = true

################################################################################
[analytics]
################################################################################
reporting_enabled   = false
check_for_updates   = false
check_for_plugin_updates = false

################################################################################
[log]
################################################################################
mode  = console file
level = warn
filters = rendering:debug

[log.console]
format = text

[log.file]
log_rotate  = true
max_lines   = 1000000
max_size_shift = 28   # 256 MB
daily_rotate   = true
max_days       = 7

################################################################################
[alerting]
################################################################################
# Grafana alerting désactivé : les alertes sont gérées par Prometheus Alertmanager
enabled    = false
execute_alerts = false

################################################################################
[unified_alerting]
################################################################################
enabled = false

################################################################################
[dashboards]
################################################################################
versions_to_keep = 20
min_refresh_interval = 5s

################################################################################
[panels]
################################################################################
disable_sanitize_html = false
enable_alpha          = false

################################################################################
[plugins]
################################################################################
allow_loading_unsigned_plugins =

################################################################################
[feature_toggles]
################################################################################
# Activer les nouvelles fonctionnalités utiles pour l'IoT
enable = publicDashboards

################################################################################
[public_dashboards]
################################################################################
# Permet de partager des dashboards avec token public (optionnel, pour rapports)
enabled = true

################################################################################
[smtp]
################################################################################
# Configurer pour les notifications Grafana si nécessaire
enabled  = false
# host     = smtp.aciertech.tg:587
# user     = grafana@aciertech.tg
# password = CHANGE_ME
# from_address = grafana@aciertech.tg
# from_name    = Grafana AcierTech

################################################################################
[rendering]
################################################################################
# Serveur de rendu pour export PNG/PDF des dashboards (optionnel)
server_url  =
callback_url =

################################################################################
[date_formats]
################################################################################
# Lomé : UTC+0, pas de DST
default_timezone = UTC
full_date         = YYYY-MM-DD HH:mm:ss
interval_second   = HH:mm:ss
interval_minute   = HH:mm
interval_hour     = MM/DD HH:mm
interval_day      = MM/DD
interval_month    = YYYY-MM
interval_year     = YYYY