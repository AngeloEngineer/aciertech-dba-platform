# =============================================================================
# AcierTech Industries — pgBouncer Primaire (Lecture/Écriture)
# Fichier : /etc/pgbouncer/pgbouncer.ini
# Port    : 6432
# Cible   : HAProxy port 5000 → Primaire PostgreSQL
# INF1620 — Cluster PostgreSQL 16 Haute Disponibilité
# =============================================================================

[databases]
# ---------------------------------------------------------------------------
# Format : <alias_applicatif> = host=<haproxy_ip> port=<haproxy_port_RW> dbname=<db>
#
# Les applications se connectent sur pgBouncer:6432 en ciblant "aciertech_db".
# pgBouncer forward vers HAProxy:5000 qui route vers le primaire PostgreSQL.
# En cas de failover, HAProxy rebascule automatiquement — pgBouncer suit.
# ---------------------------------------------------------------------------
aciertech_db = host=192.168.1.10 port=5000 dbname=aciertech_db

# Base d'administration DBA (accès restreint)
aciertech_admin = host=192.168.1.10 port=5000 dbname=aciertech_db auth_user=postgres

[pgbouncer]
# ---------------------------------------------------------------------------
# Réseau
# ---------------------------------------------------------------------------
listen_addr = 0.0.0.0
listen_port = 6432

# Fichier d'authentification des utilisateurs pgBouncer
auth_file = /etc/pgbouncer/userlist.txt

# Méthode d'authentification côté client (md5 = compatible avec tout driver)
auth_type = md5

# Fichier PID
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Socket Unix (pour connexions locales)
unix_socket_dir = /var/run/pgbouncer

# ---------------------------------------------------------------------------
# Mode de pooling
# ---------------------------------------------------------------------------
# transaction : le pool est partagé entre requêtes (mode recommandé pour IoT)
#   → Idéal pour des connexions courtes et nombreuses (47 capteurs + app IA)
#   → INCOMPATIBLE avec les advisory locks et SET LOCAL
# session    : une connexion PostgreSQL par session client (moins efficace)
# statement  : une connexion par statement (très restrictif, déconseillé)
pool_mode = transaction

# ---------------------------------------------------------------------------
# Taille des pools
# ---------------------------------------------------------------------------
# Nombre max de connexions côté serveur (vers PostgreSQL via HAProxy)
# Règle : max_connections PostgreSQL / nombre de pgBouncers / facteur de sécurité
# Avec max_connections=200 et 2 pgBouncers → 80 côté primaire
server_pool_size = 80

# Connexions de réserve pour les utilisateurs admin en cas de saturation
reserve_pool_size = 5
reserve_pool_timeout = 3

# Max connexions clients (IoT, app IA, console DBA) vers pgBouncer
max_client_conn = 500

# Connexions côté serveur maintenues "ouvertes" même sans client actif
# Réduit la latence de connexion (pas de handshake PostgreSQL à chaque fois)
server_idle_timeout = 600
min_pool_size = 5

# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 600
query_wait_timeout = 120
client_login_timeout = 60

# ---------------------------------------------------------------------------
# Reconnexion automatique après failover
# ---------------------------------------------------------------------------
# Après un failover Patroni, HAProxy met à jour son backend.
# pgBouncer détecte que le serveur PostgreSQL (via HAProxy) est indisponible
# et réessaie automatiquement selon server_login_retry.
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30

# ---------------------------------------------------------------------------
# Logging & monitoring
# ---------------------------------------------------------------------------
logfile = /var/log/pgbouncer/pgbouncer.log
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# Interface de supervision (port 6432, base "pgbouncer")
# SHOW POOLS; SHOW STATS; SHOW CLIENTS; SHOW SERVERS;
admin_users = postgres
stats_users = postgres, aciertech_app

# ---------------------------------------------------------------------------
# Métriques Prometheus (via pgbouncer_exporter sur port 9127)
# ---------------------------------------------------------------------------
# pgbouncer_exporter lira les stats via la pseudo-base "pgbouncer"

# =============================================================================
# CONNEXION CLIENT TYPE (application IoT / IA) :
#   psql -h 192.168.1.10 -p 6432 -U aciertech_app -d aciertech_db
#
# SUPERVISION DE L'ÉTAT DU POOL :
#   psql -h 127.0.0.1 -p 6432 -U postgres pgbouncer -c "SHOW POOLS;"
#   psql -h 127.0.0.1 -p 6432 -U postgres pgbouncer -c "SHOW STATS;"
#
# RECHARGEMENT DE LA CONFIG (sans coupure) :
#   psql -h 127.0.0.1 -p 6432 -U postgres pgbouncer -c "RELOAD;"
# =============================================================================