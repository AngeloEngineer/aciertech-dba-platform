# =============================================================================
# AcierTech Industries — pgBouncer Réplicas (Lecture seule)
# Fichier : /etc/pgbouncer/pgbouncer-replica.ini
# Port    : 6433
# Cible   : HAProxy port 5001 → Réplicas PostgreSQL (round-robin)
# INF1620 — Cluster PostgreSQL 16 Haute Disponibilité
#
# CE POOLER EST DÉDIÉ AUX WORKLOADS LECTURE :
#   - Dashboards Grafana
#   - Exports vers le modèle IA de maintenance prédictive
#   - Requêtes analytiques / rapports DBA
#   - Console Web FastAPI (lectures)
#
# Il ne faut JAMAIS connecter une écriture sur ce pooler.
# Les écritures passent par pgbouncer.ini (port 6432).
# =============================================================================

[databases]
# ---------------------------------------------------------------------------
# Toutes les connexions sur ce pooler arrivent en lecture seule.
# HAProxy:5001 distribue entre les réplicas actifs (round-robin).
# La directive "options=-c default_transaction_read_only=on" force la lecture
# seule côté PostgreSQL — double protection contre les écritures accidentelles.
# ---------------------------------------------------------------------------
aciertech_db = host=192.168.1.10 port=5001 dbname=aciertech_db \
               options=-c\ default_transaction_read_only=on

# Alias dédié pour l'export IA (même backend, nommage explicite)
aciertech_ai_ro = host=192.168.1.10 port=5001 dbname=aciertech_db \
                  options=-c\ default_transaction_read_only=on

[pgbouncer]
# ---------------------------------------------------------------------------
# Réseau
# ---------------------------------------------------------------------------
listen_addr = 0.0.0.0
listen_port = 6433

auth_file = /etc/pgbouncer/userlist.txt
auth_type = md5

pidfile  = /var/run/pgbouncer/pgbouncer-replica.pid
unix_socket_dir = /var/run/pgbouncer

# ---------------------------------------------------------------------------
# Mode de pooling
# ---------------------------------------------------------------------------
# transaction : adapté aux lectures courtes (requêtes Grafana, exports IA)
pool_mode = transaction

# ---------------------------------------------------------------------------
# Taille des pools
# ---------------------------------------------------------------------------
# Les réplicas absorbent les lectures : pool plus large côté serveur
# 2 réplicas disponibles → 40 connexions par réplica max via HAProxy
server_pool_size = 60
reserve_pool_size = 10
reserve_pool_timeout = 3

# Plus de clients autorisés côté lecture (dashboards + IA + opérateurs)
max_client_conn = 300
min_pool_size = 3

# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
server_connect_timeout = 15
server_login_retry = 15
# Timeout plus court pour les requêtes analytiques longues
client_idle_timeout = 300
query_wait_timeout = 60
client_login_timeout = 60

# ---------------------------------------------------------------------------
# Reset & vérification santé
# ---------------------------------------------------------------------------
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30

# ---------------------------------------------------------------------------
# Logging & monitoring
# ---------------------------------------------------------------------------
logfile = /var/log/pgbouncer/pgbouncer-replica.log
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

admin_users = postgres
stats_users = postgres, aciertech_app

# =============================================================================
# CONNEXION CLIENT TYPE (lecture seule — Grafana, IA, analytics) :
#   psql -h 192.168.1.10 -p 6433 -U aciertech_app -d aciertech_db
#
# SUPERVISION DE L'ÉTAT DU POOL RÉPLICA :
#   psql -h 127.0.0.1 -p 6433 -U postgres pgbouncer -c "SHOW POOLS;"
#   psql -h 127.0.0.1 -p 6433 -U postgres pgbouncer -c "SHOW SERVERS;"
#
# TEST QUE LE POOLER REFUSE BIEN LES ÉCRITURES :
#   psql -h 192.168.1.10 -p 6433 -U aciertech_app -d aciertech_db \
#     -c "INSERT INTO iot_raw.sensor_readings ..."
#   → Doit retourner : ERROR: cannot execute INSERT in a read-only transaction
#
# DÉMARRAGE DU SERVICE REPLICA BOUNCER :
#   pgbouncer -d /etc/pgbouncer/pgbouncer-replica.ini
#   # ou via systemd si tu crées un second service unit
# =============================================================================