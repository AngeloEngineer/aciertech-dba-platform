# =============================================================================
# AcierTech Industries — Configuration HAProxy
# Fichier : /etc/haproxy/haproxy.cfg
# INF1620 — Cluster PostgreSQL 16 Haute Disponibilité
#
# PORTS EXPOSÉS :
#   5000 → PostgreSQL Lecture/Écriture (primaire uniquement)
#   5001 → PostgreSQL Lecture seule (réplicas uniquement)
#   7000 → Interface web de statistiques HAProxy
#
# HEALTH CHECKS :
#   HAProxy interroge l'API REST Patroni (port 8008) toutes les 2 secondes.
#   GET /master  → HTTP 200 si le nœud est primaire  → éligible port 5000
#   GET /replica → HTTP 200 si le nœud est réplica   → éligible port 5001
# =============================================================================
 
# ---------------------------------------------------------------------------
# Section GLOBAL : paramètres du processus HAProxy
# ---------------------------------------------------------------------------
global
    maxconn         4096
    log             /dev/log local0
    log             /dev/log local1 notice
    chroot          /var/lib/haproxy
    stats socket    /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout   30s
    user            haproxy
    group           haproxy
    daemon
 
    # Optimisations TLS (non utilisé ici, préparation production)
    # ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:...
    # ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
 
# ---------------------------------------------------------------------------
# Section DEFAULTS : paramètres hérités par les frontends/backends
# ---------------------------------------------------------------------------
defaults
    log             global
    mode            tcp
    option          tcplog
    option          dontlognull
 
    # Timeouts (valeurs adaptées à PostgreSQL transactionnel)
    timeout connect 4s
    timeout client  30m       # Long pour les transactions / requêtes analytiques
    timeout server  30m
    timeout check   5s
 
    retries         3
    maxconn         200
 
# ---------------------------------------------------------------------------
# FRONTEND — Port 5000 : Lecture/Écriture → Primaire uniquement
# ---------------------------------------------------------------------------
frontend fe_postgres_rw
    bind *:5000
    mode tcp
    option tcplog
 
    # Log les connexions entrantes avec client IP
    log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %{+Q}r"
 
    default_backend be_postgres_primary
 
# ---------------------------------------------------------------------------
# BACKEND — Primaire PostgreSQL (port 5000)
# Health check : GET /master sur l'API Patroni (port 8008)
# Un seul nœud actif à la fois → celui qui répond 200 sur /master
# ---------------------------------------------------------------------------
backend be_postgres_primary
    mode tcp
    option httpchk GET /master
 
    # L'URL du health check cible l'API REST Patroni
    http-check expect status 200
 
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
 
    # Les 3 nœuds sont déclarés — HAProxy active uniquement le primaire
    server pg-node-1 192.168.1.11:5432 check port 8008
    server pg-node-2 192.168.1.12:5432 check port 8008
    server pg-node-3 192.168.1.13:5432 check port 8008
 
# ---------------------------------------------------------------------------
# FRONTEND — Port 5001 : Lecture seule → Réplicas uniquement
# ---------------------------------------------------------------------------
frontend fe_postgres_ro
    bind *:5001
    mode tcp
    option tcplog
 
    default_backend be_postgres_replicas
 
# ---------------------------------------------------------------------------
# BACKEND — Réplicas PostgreSQL (port 5001)
# Health check : GET /replica sur l'API Patroni (port 8008)
# Répartition en round-robin entre les réplicas actifs
# Le primaire répond 503 sur /replica → il est automatiquement exclu
# ---------------------------------------------------------------------------
backend be_postgres_replicas
    mode tcp
    option httpchk GET /replica
 
    http-check expect status 200
 
    # balance roundrobin → distribution équitable des lectures entre réplicas
    balance roundrobin
 
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
 
    server pg-node-1 192.168.1.11:5432 check port 8008
    server pg-node-2 192.168.1.12:5432 check port 8008
    server pg-node-3 192.168.1.13:5432 check port 8008
 
# ---------------------------------------------------------------------------
# FRONTEND + BACKEND — Port 7000 : Interface de statistiques HAProxy
# ATTENTION : En production, restreindre l'accès par IP ou activer l'auth.
# ---------------------------------------------------------------------------
frontend fe_stats
    bind *:7000
    mode http
    stats enable
    stats uri /stats
    stats realm "AcierTech HAProxy — Statistiques"
    stats auth admin:haproxy_stats_password_here
    stats refresh 5s
    stats show-legends
    stats show-node
    # Cache les nœuds avec 0 connexion depuis plus de 60s
    # stats hide-version   # Masquer la version HAProxy en prod
 
    # Page de santé simple pour un monitoring externe
    monitor-uri /health
 
# =============================================================================
# VÉRIFICATION DE LA CONFIGURATION :
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#
# RECHARGEMENT À CHAUD (sans coupure de connexions) :
#   systemctl reload haproxy
#   # ou : haproxy -f /etc/haproxy/haproxy.cfg -p /run/haproxy.pid -sf $(cat /run/haproxy.pid)
#
# ÉTAT DES BACKENDS VIA CLI :
#   echo "show stat" | socat stdio /run/haproxy/admin.sock | cut -d',' -f1,2,18,19
#
# ACCÈS AUX STATS WEB :
#   http://192.168.1.10:7000/stats
# =============================================================================
