# ==============================================================================
# PROJET    : AcierTech Industries S.A. — INF1620 Formation DBA PostgreSQL 16 HA
# FICHIER   : 03-backup/pgbackrest/pgbackrest.conf
# OBJET     : Configuration pgBackRest — stanza aciertech, rétention 4 FULL + WAL
# DÉPLOYER  : /etc/pgbackrest/pgbackrest.conf  (sur les 3 nœuds + backup-server)
# AUTEUR    : DBA AcierTech / INF1620
# VERSION   : 1.0 — pgBackRest 2.49+ / PostgreSQL 16
# ==============================================================================
#
# TOPOLOGIE DE BACKUP
# ───────────────────
#   pg-node-1 :5432  ← primary Patroni (potentiel)
#   pg-node-2 :5432  ← standby préféré pour le backup (backup-standby=y)
#   pg-node-3 :5432  ← standby
#   backup-server    ← dépôt pgBackRest (NFS ou dédié)
#
#   Flux :   pg-node-2 ──(backup-standby)──► backup-server:/var/lib/pgbackrest
#
# RÉTENTION
# ─────────
#   4 backups FULL conservés (≈ 4 semaines si FULL hebdomadaire)
#   WAL archivé en continu → PITR possible sur toute la période
#   Diff quotidien lun-sam → RPO ≤ 24h, RTO optimisé
#
# DÉPLOIEMENT INITIAL
# ───────────────────
#   1. Copier ce fichier sur les 4 machines :
#      scp pgbackrest.conf root@pg-node-{1,2,3}:/etc/pgbackrest/pgbackrest.conf
#      scp pgbackrest.conf root@backup-server:/etc/pgbackrest/pgbackrest.conf
#   2. Créer le dépôt sur backup-server :
#      mkdir -p /var/lib/pgbackrest
#      chown pgbackrest:pgbackrest /var/lib/pgbackrest
#      chmod 750 /var/lib/pgbackrest
#   3. Configurer SSH sans mot de passe entre postgres@pg-node-* ↔ pgbackrest@backup-server
#   4. Initialiser la stanza :
#      pgbackrest --stanza=aciertech stanza-create
#   5. Vérifier :
#      pgbackrest --stanza=aciertech check
#
# ALTÉRATIONS SCHEMA REQUISES (à appliquer sur aciertech_db avant le 1er backup)
# ────────────────────────────────────────────────────────────────────────────────
#   ALTER TABLE dba_schema.backup_history
#       ADD COLUMN IF NOT EXISTS size_bytes    BIGINT,
#       ADD COLUMN IF NOT EXISTS pitr_target   TIMESTAMPTZ,
#       ADD COLUMN IF NOT EXISTS repo_path     TEXT,
#       ADD COLUMN IF NOT EXISTS error_detail  TEXT;
#   -- Ces colonnes enrichissent les logs pour le dashboard 05-webapp/
# ==============================================================================


# ------------------------------------------------------------------------------
# SECTION GLOBALE
# ------------------------------------------------------------------------------
[global]

# Répertoire du dépôt de backup (NFS monté en lecture/écriture sur backup-server)
# Monter via /etc/fstab : backup-server:/export/pgbackrest /var/lib/pgbackrest nfs ...
repo1-path=/var/lib/pgbackrest

# Type de dépôt : posix (NFS local), s3 (cloud), azure, gcs
# Pour migration vers MinIO/S3 → remplacer par :
#   repo1-type=s3
#   repo1-s3-bucket=aciertech-pgbackrest
#   repo1-s3-endpoint=minio.aciertech.local:9000
#   repo1-s3-region=us-east-1
#   repo1-s3-key=<ACCESS_KEY>
#   repo1-s3-key-secret=<SECRET_KEY>
#   repo1-s3-uri-style=path
repo1-type=posix

# Chiffrement du dépôt (AES-256-CBC)
# La passphrase est lue depuis un fichier protégé, jamais en clair ici
# Générer : openssl rand -base64 48 > /etc/pgbackrest/repo-cipher.key
#           chmod 400 /etc/pgbackrest/repo-cipher.key
#           chown pgbackrest:pgbackrest /etc/pgbackrest/repo-cipher.key
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=/etc/pgbackrest/repo-cipher.key

# Rétention des backups FULL
# 4 FULL conservés (≈ 4 semaines si schedule hebdomadaire)
repo1-retention-full=4

# Rétention des archives WAL : basée sur la rétention FULL
# pgBackRest supprime les WAL qui ne sont plus nécessaires pour restaurer
# le plus ancien backup FULL conservé
repo1-retention-archive=4
repo1-retention-archive-type=full

# Compression : lz4 (meilleur ratio vitesse/compression pour données IoT numériques)
# Alternatives : zst (meilleure compression), none (max vitesse, espace disque++)
compress-type=lz4
compress-level=3

# Parallélisme : 2 jobs (adapté à un serveur backup modeste)
# Augmenter à 4 si le backup-server a ≥ 8 cœurs
process-max=2

# Archivage WAL asynchrone : améliore les performances d'écriture sur primary
archive-async=y
archive-get-queue-max=128mb

# Délai d'attente pour backup depuis standby (secondes)
# Si le standby est en retard > 60s, pgBackRest utilise le primary automatiquement
archive-copy=n

# Logs pgBackRest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
log-timestamp=y

# Timeout de connexion et commande
db-timeout=1800
protocol-timeout=1830

# Lock path
lock-path=/run/pgbackrest


# ------------------------------------------------------------------------------
# SECTION STANZA : aciertech
# Correspond à la base aciertech_db sur le cluster Patroni
# ------------------------------------------------------------------------------
[aciertech]

# Nœud primary (ou potentiel primary) — pgBackRest interroge Patroni API
# pour identifier le primary courant via pg-primary
pg1-host=pg-node-1
pg1-host-user=postgres
pg1-path=/var/lib/postgresql/16/main
pg1-port=5432
pg1-user=postgres

# Standby 1 — source préférée pour le backup (backup-standby=y)
pg2-host=pg-node-2
pg2-host-user=postgres
pg2-path=/var/lib/postgresql/16/main
pg2-port=5432

# Standby 2 — utilisé si pg-node-2 est indisponible
pg3-host=pg-node-3
pg3-host-user=postgres
pg3-path=/var/lib/postgresql/16/main
pg3-port=5432

# BACKUP DEPUIS LE STANDBY
# pgBackRest se connecte au primary pour les métadonnées de contrôle
# mais lit les données physiques depuis pg-node-2 (standby)
# → Zéro impact sur les INSERT IoT du primary
backup-standby=y

# Délai de vérification de cohérence archive/standby avant backup
archive-check=y

# Option de reprise : utile pour les backups longs interrompus
resume=y

# Paramètres de recovery générés lors d'une restauration PITR
# Compatible Patroni : on utilise restore_command pgBackRest
# recovery-option=recovery_target_action=promote  ← injecté par restore_pitr.sh

# Bundle WAL pour réduire le nombre de fichiers dans le dépôt
# (PG16 : chaque WAL = 16MB par défaut)
# repo1-bundle=y  ← activer si > 1000 fichiers WAL dans le dépôt


# ------------------------------------------------------------------------------
# SECTION GLOBAL:ARCHIVE — paramètres spécifiques à l'archivage WAL continu
# ------------------------------------------------------------------------------
[global:archive-push]
# Compression WAL : zst pour les archives (meilleur ratio que lz4 sur fichiers WAL)
compress-type=zst
compress-level=6

[global:archive-get]
# Pas de parallélisme sur archive-get (recovery linéaire par nature)
process-max=1


# ==============================================================================
# NOTE PATRONI — postgresql.conf à configurer sur chaque nœud
# ==============================================================================
# Les paramètres suivants doivent être présents dans postgresql.conf
# (ou dans patroni.yml section postgresql.parameters) :
#
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=aciertech archive-push %p'
#   archive_timeout = 60
#   wal_level = replica
#   max_wal_senders = 10      # déjà configuré pour Patroni
#   wal_keep_size = 1024      # 1GB de WAL local en tampon
#
# Dans patroni.yml (section bootstrap.dcs ou postgresql.parameters) :
#   restore_command: pgbackrest --stanza=aciertech archive-get %f %p
#
# ==============================================================================
# NOTE pg_hba.conf — accès pgBackRest
# ==============================================================================
# Ajouter sur chaque nœud (ou gérer via Patroni pg_hba) :
#   local   replication   postgres                    trust
#   host    replication   postgres   127.0.0.1/32     trust
#   host    replication   postgres   <ip-pg-node-2>   scram-sha-256
#   host    postgres      postgres   <ip-backup-srv>  scram-sha-256
# ==============================================================================