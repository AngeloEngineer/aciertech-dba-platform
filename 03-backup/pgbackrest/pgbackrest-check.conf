# ==============================================================================
# PROJET    : AcierTech Industries S.A. — INF1620 Formation DBA PostgreSQL 16 HA
# FICHIER   : 03-backup/pgbackrest/pgbackrest-check.conf
# OBJET     : Configuration pgBackRest pour l'instance de TEST de restauration
# DÉPLOYER  : /etc/pgbackrest/pgbackrest-check.conf  (sur restore-test-server)
# UTILISÉ PAR: scripts/test_restore.sh (test hebdomadaire automatisé)
# AUTEUR    : DBA AcierTech / INF1620
# VERSION   : 1.0 — pgBackRest 2.49+ / PostgreSQL 16
# ==============================================================================
#
# POURQUOI UN FICHIER SÉPARÉ ?
# ────────────────────────────
#   L'instance de test de restauration est une machine distincte (ou VM/conteneur)
#   qui NE DOIT PAS interférer avec le cluster Patroni de production.
#
#   Différences clés avec pgbackrest.conf :
#     • pg1-path pointe vers un répertoire de test (/tmp/pgbackrest-test/data)
#     • pg1-port = 5433 (port dédié test, ne pas utiliser 5432)
#     • Pas de backup-standby (pas de cluster Patroni sur la machine de test)
#     • log-path séparé pour ne pas polluer les logs production
#     • restore-target-action=promote (instance test doit démarrer seule)
#
#   Topologie :
#     backup-server:/var/lib/pgbackrest  (même dépôt que production, lecture seule)
#          │
#          └──(restore)──► restore-test-server:/tmp/pgbackrest-test/data  :5433
#
# MACHINE DE TEST REQUISE
# ───────────────────────
#   OS     : Ubuntu 24.04 (identique aux nœuds production)
#   PG     : PostgreSQL 16 installé (pg_ctl, postgres binaires disponibles)
#   Réseau : Accès NFS lecture seule vers /var/lib/pgbackrest
#   RAM    : 2 GB minimum (suffisant pour les tests d'intégrité)
#   Disque : Espace ≥ taille du backup FULL le plus récent
#
# UTILISATION MANUELLE
# ────────────────────
#   # Restaurer le dernier backup FULL sur l'instance test :
#   pgbackrest --config=/etc/pgbackrest/pgbackrest-check.conf \
#              --stanza=aciertech-check \
#              --type=default \
#              restore
#
#   # Restaurer à un point précis (PITR test) :
#   pgbackrest --config=/etc/pgbackrest/pgbackrest-check.conf \
#              --stanza=aciertech-check \
#              --type=time \
#              --target="2025-03-15 03:00:00+00" \
#              --target-action=promote \
#              restore
# ==============================================================================

[global]

# Même dépôt que la production — monté en lecture seule sur restore-test-server
# /etc/fstab : backup-server:/export/pgbackrest /var/lib/pgbackrest nfs ro,_netdev 0 0
repo1-path=/var/lib/pgbackrest
repo1-type=posix

# Même clé de chiffrement que la production
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=/etc/pgbackrest/repo-cipher.key

# Logs séparés (ne pas mélanger avec les logs de test_restore.sh)
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest-check
log-timestamp=y

# Parallélisme réduit (machine de test moins puissante)
process-max=2

# Timeouts
db-timeout=1800
protocol-timeout=1830

lock-path=/run/pgbackrest-check


# ------------------------------------------------------------------------------
# STANZA DE TEST : aciertech-check
# Pointe vers l'instance PostgreSQL isolée sur la machine de test
# ------------------------------------------------------------------------------
[aciertech-check]

# Instance PostgreSQL de test — port 5433, répertoire dédié
# Ce répertoire est SUPPRIMÉ et RECRÉÉ à chaque test (voir test_restore.sh)
pg1-path=/tmp/pgbackrest-test/data
pg1-port=5433
pg1-user=postgres
pg1-socket-path=/tmp

# Pas de backup-standby sur l'instance de test
# (machine standalone, pas de cluster Patroni)


# ==============================================================================
# INITIALISATION DE LA STANZA DE TEST
# À exécuter une seule fois sur restore-test-server après déploiement
# ==============================================================================
# Sur restore-test-server, en tant que postgres :
#
#   # 1. Créer les répertoires
#   mkdir -p /tmp/pgbackrest-test/data
#   chmod 700 /tmp/pgbackrest-test/data
#   mkdir -p /var/log/pgbackrest-check
#   chown postgres:postgres /var/log/pgbackrest-check
#
#   # 2. Créer la stanza de test (pointe sur le même dépôt production)
#   pgbackrest --config=/etc/pgbackrest/pgbackrest-check.conf \
#              --stanza=aciertech-check \
#              stanza-create
#
#   # 3. Vérifier la lisibilité du dépôt
#   pgbackrest --config=/etc/pgbackrest/pgbackrest-check.conf \
#              --stanza=aciertech-check \
#              info
# ==============================================================================
#
# ==============================================================================
# POSTGRESQL.CONF MINIMAL pour l'instance de test (généré par test_restore.sh)
# ==============================================================================
# Le script test_restore.sh injecte ces paramètres après la restauration :
#
#   port = 5433
#   listen_addresses = 'localhost'
#   archive_mode = off           # PAS d'archivage depuis l'instance test
#   hot_standby = off
#   wal_level = minimal
#   max_connections = 20         # Instance test, pas besoin de plus
#   shared_buffers = 256MB
#   # Tous les autres paramètres par défaut
# ==============================================================================